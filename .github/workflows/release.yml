name: Release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing exact x.y.z version tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # actions/checkout v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag and collision
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" || exit 1
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists (draft or published); refusing to replace assets"
            exit 1
          fi
      # actions/setup-node v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package
      - run: npm run release:check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - name: Create draft (never publish automatically)
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/main.js dist/manifest.json dist/styles.css \
            "dist/workspace-word-highlight-$RELEASE_TAG.zip" dist/SHA256SUMS \
            --verify-tag --draft --title "$RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
